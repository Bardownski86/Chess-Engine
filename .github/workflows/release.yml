# When a release is published on GitHub, build chess-engine.jar and attach it
# to the release so people can download it without compiling anything.
name: Attach jar to release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: sh build.sh
      - run: gh release upload "${{ github.event.release.tag_name }}" chess-engine.jar --clobber
        env:
          GH_TOKEN: ${{ github.token }}
